name: Independent replication result
description: Share a reviewed aggregate or synthetic result, including failures.
title: "[Replication] "
body:
  - type: markdown
    attributes:
      value: "Use docs/community/REPLICATION.md. No raw participant data, consent forms or persistent identifiers."
  - type: textarea
    id: record
    attributes:
      label: Completed replication record (public-safe fields only)
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Synthetic artifacts, hashes and exact reproduction instructions
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations, missing gates, privacy review and independence/conflicts
    validations:
      required: true
